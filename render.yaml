services:
  - type: web
    name: ingeniumcode-fdm
    runtime: python
    plan: free
    region: oregon
    branch: deploy-render-weasyprint
    buildCommand: |
      apt-get update && apt-get install -y \
        libpango-1.0-0 \
        libpangoft2-1.0-0 \
        libharfbuzz-subset0 \
        libffi-dev \
        libcairo2 \
        libgdk-pixbuf-2.0-0 \
        shared-mime-info \
        fonts-liberation && \
      pip install -r requirements.txt && \
      mkdir -p logs && \
      python manage.py collectstatic --no-input && \
      python manage.py migrate
    startCommand: gunicorn project_gestion.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: ingeniumcode-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

databases:
  - name: ingeniumcode-db
    databaseName: ingeniumcode_fdm
    user: ingeniumcode_user
    plan: free
    region: oregon
